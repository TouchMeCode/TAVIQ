name: Feature request
description: Suggest a new feature or a change to the TAVIQ language.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Changes to TAVIQ syntax need agreement from the maintainers before work starts.
        See docs/PROJECT_GOVERNANCE.md.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do that TAVIQ does not support well today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the feature. For syntax changes, include example TAVIQ code and its expected output.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false
  - type: dropdown
    id: syntax-change
    attributes:
      label: Does this change TAVIQ syntax?
      options:
        - "No"
        - "Yes, it adds new syntax"
        - "Yes, it changes existing syntax"
        - "Not sure"
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues and this has not been requested.
          required: true
        - label: I agree to follow the Code of Conduct.
          required: true
